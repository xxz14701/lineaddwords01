<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="001.png">
    <title>貼圖文字小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <style>
        @font-face {
            font-family: 'KNMaiyuan';
            src: url('KNMaiyuan-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        :root { font-family: 'Inter', '微軟正黑體', sans-serif; }

        .canvas-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            border: 4px solid #e5e7eb;
            border-radius: 1rem;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none; /* 防止手機滑動頁面 */
        }
        
        .canvas-container.has-text {
            cursor: move;
        }
        
        /* 橡皮擦模式下的游標 */
        .canvas-container.eraser-mode {
            cursor: crosshair !important;
        }
        
        .canvas-container:active {
            border-color: #3b82f6;
        }
        
        .canvas-preview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* 文字選取框和控點 */
        .text-box-overlay {
            position: absolute;
            border: 2px dashed #3b82f6;
            pointer-events: all;
            display: none;
            cursor: move;
        }
        
        .text-box-overlay.active {
            display: block;
        }
        
        .control-point {
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border: 3px solid #3b82f6;
            border-radius: 50%;
            pointer-events: all;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            touch-action: none;
        }
        
        .control-point.rotate {
            background: #10b981;
            border-color: #10b981;
            cursor: grab;
        }
        
        .control-point.rotate:active {
            cursor: grabbing;
        }
        
        .control-point.scale {
            cursor: nwse-resize;
        }
        
        .control-point.scale-nw { cursor: nwse-resize; }
        .control-point.scale-ne { cursor: nesw-resize; }
        .control-point.scale-sw { cursor: nesw-resize; }
        .control-point.scale-se { cursor: nwse-resize; }
        
        /* 拖曳提示 */
        .drag-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .canvas-container:active .drag-hint {
            opacity: 1;
        }
        
        #stickerUpload, #fontUpload { display: none; }
        
        .sticker-text-input {
            font-size: 1.1rem;
            padding: 0.75rem;
            min-height: 100px;
            resize: vertical;
        }
        
        .btn-hover:active { 
            transform: scale(0.95);
        }
        
        /* Toggle 開關樣式 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #3b82f6;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        
        /* 橡皮擦模式按鈕樣式 */
        .mode-active {
            background-color: #ef4444 !important; /* Red-500 */
            color: white !important;
            border-color: #b91c1c !important;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-2xl p-6 sm:p-10 border-t-8 border-orange-500">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-800 mb-4 tracking-wide">
                🎨 LINE貼圖文字小幫手
            </h1>
            <p class="text-xl text-gray-600 font-medium">
                支援多行文字、塗抹去背、直覺式控點操作！
            </p>
        </div>

        

        <div class="bg-blue-50 rounded-2xl p-6 mb-8 border-2 border-blue-200">
            <h2 class="text-2xl font-bold text-blue-800 mb-4 flex items-center">
                <span class="bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center mr-3 text-xl">1</span>
                選擇貼圖圖片
            </h2>
            
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex-1">
                    <button onclick="document.getElementById('stickerUpload').click()"
                            class="w-full py-6 px-4 bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold rounded-xl shadow-lg transition btn-hover flex items-center justify-center gap-3">
                        📂 點這裡選圖片 (PNG)
                    </button>
                    <input type="file" id="stickerUpload" accept="image/png,image/jpeg" multiple onchange="handleStickerUpload(event)">
                    <p id="stickerCount" class="mt-3 text-lg text-blue-600 font-medium text-center">尚未選擇圖片</p>
                </div>

                <div class="flex-1">
                    <button onclick="document.getElementById('fontUpload').click()"
                            class="w-full py-6 px-4 bg-purple-500 hover:bg-purple-600 text-white text-xl font-bold rounded-xl shadow-lg transition btn-hover flex items-center justify-center gap-3">
                        🔤 換字體 (選用)
                    </button>
                    <input type="file" id="fontUpload" accept=".ttf,.otf" onchange="handleFontUpload(event)">
                    <p id="fontStatus" class="mt-3 text-lg text-purple-600 font-medium text-center">目前字體：預設標準體</p>
                </div>
            </div>
        </div>

        <div id="editSection" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b-2 border-gray-200 pb-3 flex items-center">
                <span class="bg-orange-500 text-white rounded-full w-10 h-10 flex items-center justify-center mr-3 text-xl">2</span>
                調整內容 (塗抹去背 & 加字)
            </h2>

            <div id="stickerGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                </div>

            <div class="mt-12 pt-8 border-t-2 border-gray-300">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <span class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center mr-3 text-xl">3</span>
                    完成下載
                </h2>
                <button id="batchDownloadBtn" onclick="batchDownload()"
                        class="w-full py-6 bg-green-600 text-white font-bold text-3xl rounded-xl shadow-xl hover:bg-green-700 transition btn-hover flex items-center justify-center gap-4">
                    📦 一鍵下載全部貼圖 (ZIP壓縮包)
                </button>
                <p class="mt-4 text-lg text-gray-500 text-center">如果您想一次下載所有圖片,請按上面這個按鈕。</p>
            </div>
        </div>

        <div id="messageBox" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-800 text-white text-xl px-8 py-6 rounded-2xl shadow-2xl hidden z-50 text-center"></div>
    </div>

    <script>
        const MAX_FILE_SIZE = 5 * 1024 * 1024; 
        let loadedStickers = []; 
        let currentFontFamily = 'KNMaiyuan, Inter, "Microsoft JhengHei", sans-serif'; 
        
        // 更新後的常用語列表
        const PREDEFINED_TEXTS = [
            '早安', '謝謝', 'OK', '哈哈', '晚安', '讚', '好棒', '吃飽沒', 'Hi', '沒問題', '好喔', '生日快樂',
            '收到', '平安', '日安', '路上小心', '辛苦了', '注意保暖', '記得帶傘', '掰掰', '愛你', '感謝你', '拜託', '早點休息',
            '加油', '你可以的', '一定沒問題的', '我覺得可以', '我覺得不行', '我很厲害吧', '什麼什麼什麼', '求求你啦', '不用客氣', '是這樣嗎', '哼', '好主意',
            'Happy New Year', '恭喜發財', '情人節快樂', '母親節快樂', '父親節快樂', '端午安康', '中秋節快樂', '慶祝雙十', '重陽登高', '萬聖節快樂', '感恩節快樂', '聖誕快樂'
        ];

        const stickerGrid = document.getElementById('stickerGrid');
        const editSection = document.getElementById('editSection');

        function showMessage(message) {
            const msgBox = document.getElementById('messageBox');
            msgBox.innerHTML = message;
            msgBox.classList.remove('hidden');
            setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 2500);
        }

        function handleStickerUpload(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            loadedStickers = []; 
            stickerGrid.innerHTML = '';
            
            document.getElementById('stickerCount').textContent = `✅ 已選擇 ${files.length} 張圖片`;
            editSection.classList.remove('hidden');

            let loadedCount = 0;
            files.forEach((file, index) => {
                if (!file.type.match('image.*')) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // 創建遮罩 canvas（用於塗抹）
                        const maskCanvas = document.createElement('canvas');
                        maskCanvas.width = img.naturalWidth;
                        maskCanvas.height = img.naturalHeight;
                        
                        const stickerObject = {
                            id: `sticker-${Date.now()}-${index}`,
                            file: file,
                            img: img,
                            maskCanvas: maskCanvas, // 新增遮罩 canvas
                            text: '',
                            textColor: '#000000',
                            scale: 18,     
                            posX: 50,      
                            posY: 50,      
                            rotation: 0,   
                            eraserMode: false,  // 新增：橡皮擦模式
                            eraserSize: 30,     // 新增：橡皮擦大小
                            maskHistory: [],    // 新增：塗抹歷史記錄
                        };
                        loadedStickers.push(stickerObject);
                        createStickerCard(stickerObject);
                        
                        loadedCount++;
                        if (loadedCount === files.length) {
                            showMessage(`🎉 成功載入 ${files.length} 張圖片！`);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function handleFontUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fontName = 'CustomFont';
            const reader = new FileReader();

            reader.onload = function(e) {
                const fontFace = new FontFace(fontName, `url(${e.target.result})`);

                fontFace.load().then(function(loadedFont) {
                    document.fonts.add(loadedFont);
                    currentFontFamily = `${fontName}, 'Microsoft JhengHei', sans-serif`;
                    
                    loadedStickers.forEach(s => redrawSticker(s.id));
                    
                    document.getElementById('fontStatus').textContent = `✅ 已套用新字體：${file.name}`;
                    showMessage('✅ 字體已成功套用！');
                }).catch(function(error) {
                    console.error('字體載入失敗：', error);
                    showMessage('⚠️ 字體載入失敗，請確認檔案格式。');
                });
            };

            reader.readAsDataURL(file);
        }

        function createStickerCard(sticker) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-lg border-2 border-gray-100 overflow-hidden flex flex-col';
            card.id = `card-${sticker.id}`;
            
            const canvasContainer = document.createElement('div');
            canvasContainer.className = 'canvas-container relative';
            
            const preview = document.createElement('div');
            preview.className = 'canvas-preview';
            
            const canvas = document.createElement('canvas');
            canvas.width = sticker.img.naturalWidth;
            canvas.height = sticker.img.naturalHeight;
            sticker.canvas = canvas;
            
            const dragHint = document.createElement('div');
            dragHint.className = 'drag-hint';
            dragHint.textContent = '拖曳移動文字位置';
            
            // 文字選取框
            const textBox = document.createElement('div');
            textBox.className = 'text-box-overlay';
            
            // 控制點：旋轉（上）、縮放（四角）
            const controlPoints = [
                { class: 'rotate', position: 'top', action: 'rotate', label: '🔄' },
                { class: 'scale scale-nw', position: 'top-left', action: 'scale' },
                { class: 'scale scale-ne', position: 'top-right', action: 'scale' },
                { class: 'scale scale-sw', position: 'bottom-left', action: 'scale' },
                { class: 'scale scale-se', position: 'bottom-right', action: 'scale' }
            ];
            
            controlPoints.forEach(cp => {
                const point = document.createElement('div');
                point.className = `control-point ${cp.class}`;
                point.dataset.action = cp.action;
                if (cp.label) point.textContent = cp.label;
                textBox.appendChild(point);
            });
            
            canvasContainer.appendChild(preview);
            canvasContainer.appendChild(canvas);
            canvasContainer.appendChild(textBox);
            canvasContainer.appendChild(dragHint);
            
            redrawSticker(sticker.id);
            
            const inputGroup = document.createElement('div');
            inputGroup.className = 'p-4 bg-gray-50 border-b border-gray-200';
            
            const select = document.createElement('select');
            select.className = 'w-full mb-3 p-3 border-2 border-gray-300 rounded-lg bg-white text-lg focus:border-blue-500 focus:outline-none';
            select.innerHTML = '<option value="">📝 選擇常用語...</option>';
            PREDEFINED_TEXTS.forEach(text => {
                const option = document.createElement('option');
                option.value = text;
                option.textContent = text;
                select.appendChild(option);
            });
            
            const input = document.createElement('textarea');
            input.className = 'sticker-text-input w-full border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition';
            input.placeholder = '或直接輸入想寫的字 (支援多行)';
            input.value = sticker.text;
            
            const colorContainer = document.createElement('div');
            colorContainer.className = 'flex items-center gap-3 mt-3';
            
            const colorLabel = document.createElement('span');
            colorLabel.className = 'text-base font-medium text-gray-700';
            colorLabel.textContent = '文字顏色：';
            
            const colorPicker = document.createElement('input');
            colorPicker.type = 'color';
            colorPicker.value = sticker.textColor;
            colorPicker.className = 'w-16 h-10 border-2 border-gray-300 rounded cursor-pointer';
            colorPicker.oninput = (e) => {
                sticker.textColor = e.target.value;
                redrawSticker(sticker.id);
            };
            
            colorContainer.appendChild(colorLabel);
            colorContainer.appendChild(colorPicker);
            
            // 新增：塗抹工具控制區
            const eraserControls = document.createElement('div');
            eraserControls.className = 'mt-4 p-3 bg-yellow-50 border-2 border-yellow-200 rounded-lg';
            
            const eraserTitle = document.createElement('div');
            eraserTitle.className = 'text-base font-bold text-yellow-800 mb-2';
            eraserTitle.textContent = '✏️ 塗抹去背工具';
            
            const eraserModeBtn = document.createElement('button');
            eraserModeBtn.className = 'w-full py-2 px-4 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-lg transition mb-2';
            eraserModeBtn.textContent = '開啟塗抹模式';
            eraserModeBtn.id = `eraserBtn-${sticker.id}`;
            
            const eraserSizeControl = document.createElement('div');
            eraserSizeControl.className = 'flex items-center gap-3 mt-2';
            
            const eraserLabel = document.createElement('span');
            eraserLabel.className = 'text-sm font-medium text-gray-700 whitespace-nowrap';
            eraserLabel.textContent = '筆刷大小：';
            
            const eraserSlider = document.createElement('input');
            eraserSlider.type = 'range';
            eraserSlider.min = '10';
            eraserSlider.max = '80';
            eraserSlider.value = sticker.eraserSize;
            eraserSlider.className = 'flex-1';
            
            const eraserValue = document.createElement('span');
            eraserValue.className = 'text-sm font-bold text-gray-700 w-8 text-right';
            eraserValue.textContent = sticker.eraserSize;
            
            eraserSlider.oninput = (e) => {
                sticker.eraserSize = parseInt(e.target.value);
                eraserValue.textContent = sticker.eraserSize;
            };
            
            // 橡皮擦模式切換
            eraserModeBtn.onclick = () => {
                sticker.eraserMode = !sticker.eraserMode;
                if (sticker.eraserMode) {
                    eraserModeBtn.textContent = '關閉塗抹模式';
                    eraserModeBtn.classList.add('mode-active');
                    canvasContainer.classList.add('eraser-mode');
                    textBox.classList.remove('active');
                } else {
                    eraserModeBtn.textContent = '開啟塗抹模式';
                    eraserModeBtn.classList.remove('mode-active');
                    canvasContainer.classList.remove('eraser-mode');
                    if (sticker.text && sticker.text.trim() !== '') {
                        textBox.classList.add('active');
                    }
                }
            };
            
            eraserSizeControl.appendChild(eraserLabel);
            eraserSizeControl.appendChild(eraserSlider);
            eraserSizeControl.appendChild(eraserValue);
            
            // 新增：復原和清除按鈕
            const eraserActionBtns = document.createElement('div');
            eraserActionBtns.className = 'flex gap-2 mt-2';
            
            const undoBtn = document.createElement('button');
            undoBtn.className = 'flex-1 py-2 px-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition text-sm';
            undoBtn.textContent = '↶ 復原上一步';
            undoBtn.onclick = () => {
                if (sticker.maskHistory.length > 0) {
                    sticker.maskHistory.pop(); // 移除最後一筆
                    restoreMaskFromHistory(sticker);
                    redrawSticker(sticker.id);
                    showMessage('✅ 已復原上一步塗抹');
                } else {
                    showMessage('⚠️ 沒有可復原的操作');
                }
            };
            
            const clearBtn = document.createElement('button');
            clearBtn.className = 'flex-1 py-2 px-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-lg transition text-sm';
            clearBtn.textContent = '🗑️ 清除全部';
            clearBtn.onclick = () => {
                if (confirm('確定要清除所有塗抹嗎？')) {
                    sticker.maskHistory = [];
                    const ctx = sticker.maskCanvas.getContext('2d');
                    ctx.clearRect(0, 0, sticker.maskCanvas.width, sticker.maskCanvas.height);
                    redrawSticker(sticker.id);
                    showMessage('✅ 已清除所有塗抹');
                }
            };
            
            eraserActionBtns.appendChild(undoBtn);
            eraserActionBtns.appendChild(clearBtn);
            
            eraserControls.appendChild(eraserTitle);
            eraserControls.appendChild(eraserModeBtn);
            eraserControls.appendChild(eraserSizeControl);
            eraserControls.appendChild(eraserActionBtns);
            


            const actionsContainer = document.createElement('div');
            actionsContainer.className = "flex flex-col gap-3 p-4";

            const singleDownloadBtn = document.createElement('button');
            singleDownloadBtn.className = "w-full py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl shadow-md transition btn-hover flex items-center justify-center gap-2 text-lg";
            singleDownloadBtn.innerHTML = "📥 下載這張圖片";
            singleDownloadBtn.onclick = () => { downloadSingleSticker(sticker); };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = "w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl border border-red-200 transition flex items-center justify-center gap-2";
            deleteBtn.innerHTML = "🗑️ 刪除";
            deleteBtn.onclick = () => {
                if(confirm('確定要刪除這張圖片嗎？')) {
                    loadedStickers = loadedStickers.filter(s => s.id !== sticker.id);
                    card.remove();
                    document.getElementById('stickerCount').textContent = `✅ 已選擇 ${loadedStickers.length} 張圖片`;
                    if(loadedStickers.length === 0) showMessage("圖片已全部清空");
                }
            };

            actionsContainer.appendChild(singleDownloadBtn);
            actionsContainer.appendChild(deleteBtn);

            select.onchange = (e) => { 
                input.value = e.target.value; 
                sticker.text = e.target.value; 
                redrawSticker(sticker.id);
                updateTextBox(sticker);
                if (sticker.text.trim() !== '') {
                    textBox.classList.add('active');
                }
            };
            
            input.oninput = (e) => { 
                select.value = ''; 
                sticker.text = e.target.value; 
                redrawSticker(sticker.id);
                updateTextBox(sticker);
                if (sticker.text.trim() !== '') {
                    textBox.classList.add('active');
                } else {
                    textBox.classList.remove('active');
                }
            };

            inputGroup.appendChild(select);
            inputGroup.appendChild(input);
            inputGroup.appendChild(colorContainer);
            inputGroup.appendChild(eraserControls); // 加入塗抹控制
            
            card.appendChild(canvasContainer);
            card.appendChild(inputGroup);
            card.appendChild(actionsContainer);
            
            stickerGrid.appendChild(card);
            
            // 設定拖曳和橡皮擦功能
            setupInteraction(sticker, canvasContainer, textBox);
        }
        
        function setupInteraction(sticker, container, textBox) {
            let isDragging = false;
            let isRotating = false;
            let isScaling = false;
            let isErasing = false; // 新增：追蹤塗抹狀態
            let startX = 0, startY = 0;
            let startPosX = 0, startPosY = 0;
            let startRotation = 0;
            let startScale = 0;
            let initialDistance = 0;
            
            // 更新文字框位置和大小
            sticker.updateTextBox = (s) => {
                if (!s.text || s.text.trim() === '' || s.eraserMode) {
                    textBox.classList.remove('active');
                    return;
                }
                
                textBox.classList.add('active');
                const rect = container.getBoundingClientRect();
                const canvas = s.canvas;
                
                const fontSize = canvas.height * (s.scale / 100);
                const lines = s.text.split('\n');
                const lineHeight = fontSize * 1.2;
                const totalHeight = lineHeight * lines.length;
                
                const ctx = canvas.getContext('2d');
                ctx.font = `bold ${fontSize}px ${currentFontFamily}`;
                const maxWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
                
                const padding = fontSize * 0.3;
                const boxWidth = (maxWidth / canvas.width) * rect.width + padding * 2;
                const boxHeight = (totalHeight / canvas.height) * rect.height + padding * 2;
                
                textBox.style.left = `${(s.posX / 100) * rect.width - boxWidth / 2}px`;
                textBox.style.top = `${(s.posY / 100) * rect.height - boxHeight / 2}px`;
                textBox.style.width = `${boxWidth}px`;
                textBox.style.height = `${boxHeight}px`;
                textBox.style.transform = `rotate(${s.rotation}deg)`;
                
                // 更新控制點位置
                const points = textBox.querySelectorAll('.control-point');
                points[0].style.left = '50%';
                points[0].style.top = '-15px';
                points[1].style.left = '0';
                points[1].style.top = '0';
                points[2].style.left = '100%';
                points[2].style.top = '0';
                points[3].style.left = '0';
                points[3].style.top = '100%';
                points[4].style.left = '100%';
                points[4].style.top = '100%';
            };
            
            const getEventCoords = (e) => {
                if (e.touches && e.touches.length > 0) {
                    return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
                }
                return { clientX: e.clientX, clientY: e.clientY };
            };
            
            const getDistance = (x1, y1, x2, y2) => {
                return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            };
            
            // 控制點互動
            textBox.querySelectorAll('.control-point').forEach(point => {
                const startControl = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const coords = getEventCoords(e);
                    const rect = container.getBoundingClientRect();
                    
                    if (point.dataset.action === 'rotate') {
                        isRotating = true;
                        startRotation = sticker.rotation;
                        const centerX = rect.left + rect.width * (sticker.posX / 100);
                        const centerY = rect.top + rect.height * (sticker.posY / 100);
                        startX = coords.clientX - centerX;
                        startY = coords.clientY - centerY;
                    } else if (point.dataset.action === 'scale') {
                        isScaling = true;
                        startScale = sticker.scale;
                        const rect = container.getBoundingClientRect();
                        const centerX = rect.left + rect.width * (sticker.posX / 100);
                        const centerY = rect.top + rect.height * (sticker.posY / 100);
                        initialDistance = getDistance(coords.clientX, coords.clientY, centerX, centerY);
                    }
                };
                
                point.addEventListener('mousedown', startControl);
                point.addEventListener('touchstart', startControl, { passive: false });
            });
            
            // Canvas 容器互動（拖曳文字或塗抹）
            const startDrag = (e) => {
                if (e.target.classList.contains('control-point')) return;
                
                const coords = getEventCoords(e);
                
                // 橡皮擦模式
                if (sticker.eraserMode) {
                    isErasing = true;
                    drawOnMask(e, sticker);
                    e.preventDefault();
                    return;
                }
                
                // 文字拖曳模式
                if (sticker.text && sticker.text.trim() !== '') {
                    isDragging = true;
                    startX = coords.clientX;
                    startY = coords.clientY;
                    startPosX = sticker.posX;
                    startPosY = sticker.posY;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            };
            
            container.addEventListener('mousedown', startDrag);
            container.addEventListener('touchstart', startDrag, { passive: false });
            
            // 滑鼠/觸控移動處理
            const handleMove = (e) => {
                const coords = getEventCoords(e);
                
                // 持續塗抹
                if (isErasing) {
                    drawOnMask(e, sticker);
                    e.preventDefault();
                    return;
                }
                
                if (isDragging) {
                    const rect = container.getBoundingClientRect();
                    const deltaX = coords.clientX - startX;
                    const deltaY = coords.clientY - startY;
                    
                    const deltaXPercent = (deltaX / rect.width) * 100;
                    const deltaYPercent = (deltaY / rect.height) * 100;
                    
                    sticker.posX = Math.max(0, Math.min(100, startPosX + deltaXPercent));
                    sticker.posY = Math.max(0, Math.min(100, startPosY + deltaYPercent));
                    
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                    e.preventDefault();
                } else if (isRotating) {
                    const rect = container.getBoundingClientRect();
                    const centerX = rect.left + rect.width * (sticker.posX / 100);
                    const centerY = rect.top + rect.height * (sticker.posY / 100);
                    
                    const currentX = coords.clientX - centerX;
                    const currentY = coords.clientY - centerY;
                    
                    const startAngle = Math.atan2(startY, startX) * (180 / Math.PI);
                    const currentAngle = Math.atan2(currentY, currentX) * (180 / Math.PI);
                    
                    sticker.rotation = Math.round(startRotation + (currentAngle - startAngle));
                    sticker.rotation = Math.max(-180, Math.min(180, sticker.rotation));
                    
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                    e.preventDefault();
                } else if (isScaling) {
                    const rect = container.getBoundingClientRect();
                    const centerX = rect.left + rect.width * (sticker.posX / 100);
                    const centerY = rect.top + rect.height * (sticker.posY / 100);
                    
                    const currentDistance = getDistance(coords.clientX, coords.clientY, centerX, centerY);
                    const distanceRatio = currentDistance / initialDistance;
                    
                    sticker.scale = Math.max(5, Math.min(50, startScale * distanceRatio));
                    
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                    e.preventDefault();
                }
            };
            
            const handleEnd = () => {
                // 塗抹結束時儲存歷史記錄
                if (isErasing) {
                    saveMaskToHistory(sticker);
                }
                
                if (isDragging || isRotating || isScaling || isErasing) {
                    isDragging = false;
                    isRotating = false;
                    isScaling = false;
                    isErasing = false;
                    
                    if (sticker.eraserMode) {
                        container.style.cursor = 'crosshair';
                    } else {
                        container.style.cursor = (sticker.text && sticker.text.trim()) ? 'move' : 'crosshair';
                    }
                }
            };
            
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleEnd);
        }
        
        // 新增：塗抹繪製函數
        function drawOnMask(event, sticker) {
            const canvas = sticker.canvas;
            const rect = canvas.getBoundingClientRect();
            
            let clientX, clientY;
            if(event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            const scaleX = sticker.img.naturalWidth / rect.width;
            const scaleY = sticker.img.naturalHeight / rect.height;

            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const ctx = sticker.maskCanvas.getContext('2d');
            
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = sticker.eraserSize * (sticker.img.naturalWidth / 500); 
            ctx.strokeStyle = '#000'; 
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y);
            ctx.stroke();

            redrawSticker(sticker.id);
        }
        
        function updateTextBox(sticker) {
            if (sticker.updateTextBox) {
                sticker.updateTextBox(sticker);
            }
        }
        
        // 新增：儲存塗抹歷史記錄
        function saveMaskToHistory(sticker) {
            const imageData = sticker.maskCanvas.toDataURL();
            sticker.maskHistory.push(imageData);
            
            // 限制歷史記錄數量（最多保留20步）
            if (sticker.maskHistory.length > 20) {
                sticker.maskHistory.shift();
            }
        }
        
        // 新增：從歷史記錄復原塗抹
        function restoreMaskFromHistory(sticker) {
            const ctx = sticker.maskCanvas.getContext('2d');
            ctx.clearRect(0, 0, sticker.maskCanvas.width, sticker.maskCanvas.height);
            
            if (sticker.maskHistory.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    redrawSticker(sticker.id);
                };
                img.src = sticker.maskHistory[sticker.maskHistory.length - 1];
            }
        }

        function downloadSingleSticker(sticker) {
            if (!sticker.canvas) return;
            redrawSticker(sticker.id);
            
            let safeName = sticker.text.trim().substring(0, 8).replace(/\n/g, '_') || 'image';
            safeName = safeName.replace(/[\\/:*?"<>|]/g, '_'); 
            const fileName = `${sticker.file.name.split('.')[0]}_${safeName}.png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = sticker.canvas.toDataURL('image/png');
            link.click();
            
            showMessage('⬇️ 這張圖片已經下載囉！');
        }

        function redrawSticker(id) {
            const sticker = loadedStickers.find(s => s.id === id);
            if (!sticker || !sticker.canvas) return;

            const canvas = sticker.canvas;
            const ctx = canvas.getContext('2d');
            
            canvas.width = sticker.img.naturalWidth;
            canvas.height = sticker.img.naturalHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(sticker.img, 0, 0);

            // 應用塗抹遮罩
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.drawImage(sticker.maskCanvas, 0, 0);
            ctx.restore();

            if (sticker.text && sticker.text.trim() !== '') {
                const fontSize = canvas.height * (sticker.scale / 100);
                
                ctx.font = `bold ${fontSize}px ${currentFontFamily}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle'; 
                
                const x = canvas.width * (sticker.posX / 100);
                const y = canvas.height * (sticker.posY / 100);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(sticker.rotation * Math.PI / 180);

                const whiteStrokeWidth = fontSize * 0.06;
                const blackStrokeWidth = whiteStrokeWidth + (fontSize * 0.05);

                ctx.lineJoin = 'round';
                ctx.miterLimit = 2;

                const lines = sticker.text.split('\n');
                const lineHeight = fontSize * 1.2;
                const totalHeight = lineHeight * lines.length;
                const startY = -(totalHeight / 2) + (lineHeight / 2);
                
                lines.forEach((line, index) => {
                    const lineY = startY + index * lineHeight;
                    
                    ctx.strokeStyle = '#b8b7b5';
                    ctx.lineWidth = blackStrokeWidth;
                    ctx.strokeText(line, 0, lineY);

                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = whiteStrokeWidth;
                    ctx.strokeText(line, 0, lineY);

                    ctx.fillStyle = sticker.textColor;
                    ctx.fillText(line, 0, lineY);
                });
                
                ctx.restore();
            }
        }

        async function batchDownload() {
            if (loadedStickers.length === 0) {
                showMessage('⚠️ 沒有圖片可以下載喔！');
                return;
            }
            showMessage('⏳ 正在打包中,請稍等一下...');
            const zip = new JSZip();
            const folder = zip.folder("長輩圖_加工版");

            for (const s of loadedStickers) {
                redrawSticker(s.id);
                const data = s.canvas.toDataURL('image/png').split(',')[1];
                let safeName = s.text.trim().substring(0, 8).replace(/\n/g, '_') || 'image';
                safeName = safeName.replace(/[\\/:*?"<>|]/g, '_'); 
                folder.file(`${s.file.name.split('.')[0]}_${safeName}.png`, data, {base64: true});
            }

            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = '您的貼圖包.zip';
            a.click();
            showMessage('🎉 下載完成！請看您的下載資料夾。');
        }
    </script>
</body>
