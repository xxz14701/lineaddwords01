<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="001.png">
    <title>LINE貼圖文字編輯器 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <style>
        @font-face {
            font-family: 'KNMaiyuan';
            src: url('KNMaiyuan-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        :root { font-family: 'Inter', '微軟正黑體', sans-serif; }

        .canvas-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            border: 4px solid #e5e7eb;
            border-radius: 1rem;
            overflow: hidden;
            cursor: crosshair;
        }
        
        .canvas-container.has-text {
            cursor: move;
        }
        
        .canvas-container:active {
            border-color: #3b82f6;
        }
        
        .canvas-preview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* 文字選取框和控點 */
        .text-box-overlay {
            position: absolute;
            border: 2px dashed #3b82f6;
            pointer-events: all;
            display: none;
            cursor: move;
        }
        
        .text-box-overlay.active {
            display: block;
        }
        
        .control-point {
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border: 3px solid #3b82f6;
            border-radius: 50%;
            pointer-events: all;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            touch-action: none;
        }
        
        .control-point.rotate {
            background: #10b981;
            border-color: #10b981;
            cursor: grab;
        }
        
        .control-point.rotate:active {
            cursor: grabbing;
        }
        
        .control-point.scale {
            cursor: nwse-resize;
        }
        
        .control-point.scale-nw { cursor: nwse-resize; }
        .control-point.scale-ne { cursor: nesw-resize; }
        .control-point.scale-sw { cursor: nesw-resize; }
        .control-point.scale-se { cursor: nwse-resize; }
        
        /* 拖曳提示 */
        .drag-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .canvas-container:active .drag-hint {
            opacity: 1;
        }
        
        #stickerUpload, #fontUpload { display: none; }
        
        .sticker-text-input {
            font-size: 1.1rem;
            padding: 0.75rem;
            min-height: 100px;
            resize: vertical;
        }
        
        .btn-hover:active { 
            transform: scale(0.95);
        }
        
        /* Toggle 開關樣式 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #3b82f6;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-2xl p-6 sm:p-10 border-t-8 border-orange-500">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-800 mb-4 tracking-wide">
                🎨 LINE 貼圖文字小幫手
            </h1>
            <p class="text-xl text-gray-600 font-medium">
                支援多行文字、直覺式控點操作！
            </p>
        </div>

        

        <div class="bg-blue-50 rounded-2xl p-6 mb-8 border-2 border-blue-200">
            <h2 class="text-2xl font-bold text-blue-800 mb-4 flex items-center">
                <span class="bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center mr-3 text-xl">1</span>
                選擇貼圖圖片
            </h2>
            
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex-1">
                    <button onclick="document.getElementById('stickerUpload').click()"
                            class="w-full py-6 px-4 bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold rounded-xl shadow-lg transition btn-hover flex items-center justify-center gap-3">
                        📂 點這裡選圖片 (PNG)
                    </button>
                    <input type="file" id="stickerUpload" accept="image/png" multiple onchange="handleStickerUpload(event)">
                    <p id="stickerCount" class="text-center text-gray-500 mt-3 text-sm">尚未選擇圖片</p>
                </div>
                
                <div class="flex-1">
                    <button onclick="document.getElementById('fontUpload').click()"
                            class="w-full py-6 px-4 bg-purple-500 hover:bg-purple-600 text-white text-xl font-bold rounded-xl shadow-lg transition btn-hover flex items-center justify-center gap-3">
                        🔤 換字體 (選用)
                    </button>
                    <input type="file" id="fontUpload" accept=".ttf,.otf" onchange="handleFontUpload(event)">
                    <p id="fontStatus" class="text-center text-purple-600 mt-3 text-sm font-medium">目前字體：KNMaiyuan-Regular</p>
                </div>
            </div>
        </div>

        <div id="editSection" class="hidden">
            <div class="bg-purple-50 rounded-2xl p-6 mb-8 border-2 border-purple-200">
                <h2 class="text-2xl font-bold text-purple-800 mb-4 flex items-center">
                    <span class="bg-purple-600 text-white rounded-full w-10 h-10 flex items-center justify-center mr-3 text-xl">2</span>
                    編輯每張貼圖
                </h2>
                <div id="stickerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div class="bg-orange-50 rounded-2xl p-6 border-2 border-orange-200">
                <h2 class="text-2xl font-bold text-orange-800 mb-4 flex items-center">
                    <span class="bg-orange-600 text-white rounded-full w-10 h-10 flex items-center justify-center mr-3 text-xl">3</span>
                    下載成品
                </h2>
                <button onclick="batchDownload()" 
                        class="w-full py-6 bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white text-2xl font-bold rounded-xl shadow-lg transition btn-hover">
                    📦 打包下載全部 (ZIP)
                </button>
            </div>
        </div>

    </div>

    <div id="messageBox" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-6 py-4 rounded-2xl shadow-2xl text-lg font-bold z-50 hidden"></div>

    <script>
        let loadedStickers = [];
        let currentFontFamily = '"KNMaiyuan", sans-serif';
        
        // 建議文字列表
        const PREDEFINED_TEXTS = [
            '早安', '午安', '晚安', '謝謝', '收到', 'OK',
            '辛苦了', '讚', '好棒', '恭喜', '加油', '沒問題',
            '生日快樂', '新年快樂', '保重', '哈囉', '拜拜'
        ];
        
        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
        }

        function handleStickerUpload(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            loadedStickers = [];
            const grid = document.getElementById('stickerGrid');
            grid.innerHTML = '';
            
            document.getElementById('stickerCount').textContent = `✅ 已選擇 ${files.length} 張圖片`;
            document.getElementById('editSection').classList.remove('hidden');
            
            let loadedCount = 0;
            files.forEach((file, index) => {
                if (!file.type.startsWith('image/png')) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const id = Date.now() + Math.random();
                        const sticker = {
                            id: id,
                            file: file,
                            img: img,
                            text: '',
                            textColor: '#000000',
                            scale: 18,
                            rotation: 0,
                            posX: 50,
                            posY: 50,
                            canvas: null
                        };
                        
                        loadedStickers.push(sticker);
                        
                        loadedCount++;
                        if (loadedCount === files.filter(f => f.type.startsWith('image/png')).length) {
                            loadedStickers.sort((a, b) => a.file.name.localeCompare(b.file.name));
                            loadedStickers.forEach(s => renderStickerCard(s));
                            showMessage(`🎉 已成功載入 ${loadedStickers.length} 張圖片！`);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function handleFontUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const fontName = 'CustomFont_' + Date.now();
                const fontFace = new FontFace(fontName, `url(${e.target.result})`);
                fontFace.load().then((loadedFont) => {
                    document.fonts.add(loadedFont);
                    currentFontFamily = `"${fontName}", sans-serif`;
                    document.getElementById('fontStatus').textContent = `目前字體：${file.name}`;
                    loadedStickers.forEach(s => redrawSticker(s.id));
                    showMessage(`✅ 字體「${file.name}」已套用！`);
                }).catch(() => {
                    showMessage('❌ 字體檔案載入失敗，請確認格式正確。');
                });
            };
            reader.readAsDataURL(file);
        }

        function renderStickerCard(sticker) {
            const grid = document.getElementById('stickerGrid');
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-lg p-4 border-2 border-gray-200 hover:border-purple-400 transition';
            card.innerHTML = `
                <div class="canvas-container" id="container-${sticker.id}">
                    <div class="canvas-preview">
                        <canvas id="canvas-${sticker.id}"></canvas>
                        <div class="text-box-overlay" id="textbox-${sticker.id}">
                            <div class="control-point rotate" data-action="rotate" style="top: -30px; left: 50%;"></div>
                            <div class="control-point scale scale-nw" data-action="scale" style="top: 0; left: 0;"></div>
                            <div class="control-point scale scale-ne" data-action="scale" style="top: 0; right: 0;"></div>
                            <div class="control-point scale scale-sw" data-action="scale" style="bottom: 0; left: 0;"></div>
                            <div class="control-point scale scale-se" data-action="scale" style="bottom: 0; right: 0;"></div>
                        </div>
                    </div>
                    <div class="drag-hint">👆 拖曳移動 | 🔄 控點操作</div>
                </div>
                
                <div class="mt-4 space-y-3">
                    <!-- 建議文字選單 -->
                    <select id="select-${sticker.id}" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none font-semibold">
                        <option value="">📝 選擇常用詞...</option>
                        ${PREDEFINED_TEXTS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                    
                    <!-- 文字輸入框 -->
                    <textarea id="textarea-${sticker.id}" 
                              placeholder="輸入文字（可多行，按 Enter 換行）..."
                              class="sticker-text-input w-full border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none font-bold">${sticker.text}</textarea>
                    

                    <!-- 文字顏色 -->
                    <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border-2 border-gray-200">
                        <label class="font-bold text-gray-700">文字顏色：</label>
                        <input type="color" id="color-${sticker.id}" value="${sticker.textColor}" 
                               class="w-16 h-12 rounded-lg border-2 border-gray-300 cursor-pointer">
                    </div>
                    
                    <!-- 下載和刪除按鈕 -->
                    <button id="download-${sticker.id}"
                            class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg transition btn-hover">
                        📥 下載這張圖片
                    </button>
                    
                    <button id="delete-${sticker.id}"
                            class="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg border border-red-200 transition">
                        🗑️ 刪除
                    </button>
                </div>
            `;
            grid.appendChild(card);

            const canvas = document.getElementById(`canvas-${sticker.id}`);
            sticker.canvas = canvas;
            
            // 綁定事件
            const select = document.getElementById(`select-${sticker.id}`);
            const textarea = document.getElementById(`textarea-${sticker.id}`);
            const color = document.getElementById(`color-${sticker.id}`);
            const downloadBtn = document.getElementById(`download-${sticker.id}`);
            const deleteBtn = document.getElementById(`delete-${sticker.id}`);
            
            select.onchange = (e) => {
                if (e.target.value) {
                    textarea.value = e.target.value;
                    sticker.text = e.target.value;
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                }
            };
            
            textarea.oninput = (e) => {
                sticker.text = e.target.value;
                redrawSticker(sticker.id);
                updateTextBox(sticker);
            };
            
            color.oninput = (e) => {
                sticker.textColor = e.target.value;
                redrawSticker(sticker.id);
            };
            
            downloadBtn.onclick = () => downloadSingleSticker(sticker);
            
            deleteBtn.onclick = () => {
                if (confirm('確定要刪除這張圖片嗎？')) {
                    loadedStickers = loadedStickers.filter(s => s.id !== sticker.id);
                    card.remove();
                    document.getElementById('stickerCount').textContent = `✅ 已選擇 ${loadedStickers.length} 張圖片`;
                    if (loadedStickers.length === 0) {
                        document.getElementById('editSection').classList.add('hidden');
                        showMessage("圖片已全部清空");
                    }
                }
            };
            
            initializeCanvas(sticker);
            redrawSticker(sticker.id);
        }

        function initializeCanvas(sticker) {
            const container = document.getElementById(`container-${sticker.id}`);
            const textBox = document.getElementById(`textbox-${sticker.id}`);
            
            // 更新文字框位置和旋轉的函數
            sticker.updateTextBox = (s) => {
                const rect = container.getBoundingClientRect();
                const fontSize = rect.height * (s.scale / 100);
                const boxSize = fontSize * 2.5;
                
                const x = rect.width * (s.posX / 100);
                const y = rect.height * (s.posY / 100);
                
                textBox.style.left = `${x}px`;
                textBox.style.top = `${y}px`;
                textBox.style.width = `${boxSize}px`;
                textBox.style.height = `${boxSize}px`;
                textBox.style.transform = `translate(-50%, -50%) rotate(${s.rotation}deg)`;
                
                if (s.text && s.text.trim() !== '') {
                    textBox.classList.add('active');
                    container.classList.add('has-text');
                } else {
                    textBox.classList.remove('active');
                    container.classList.remove('has-text');
                }
            };
            
            let isDragging = false;
            let isRotating = false;
            let isScaling = false;
            let startX, startY, startPosX, startPosY, startRotation, startScale;
            let initialDistance = 0;
            
            // 觸控和滑鼠事件統一處理
            const getEventCoords = (e) => {
                if (e.touches && e.touches.length > 0) {
                    return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
                }
                return { clientX: e.clientX, clientY: e.clientY };
            };
            
            // 計算兩點距離（用於縮放）
            const getDistance = (x1, y1, x2, y2) => {
                return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            };
            
            // 控制點事件
            const controlPoints = textBox.querySelectorAll('.control-point');
            controlPoints.forEach(point => {
                const startControl = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    
                    const coords = getEventCoords(e);
                    
                    if (point.dataset.action === 'rotate') {
                        isRotating = true;
                        startRotation = sticker.rotation;
                        const rect = container.getBoundingClientRect();
                        const centerX = rect.left + rect.width * (sticker.posX / 100);
                        const centerY = rect.top + rect.height * (sticker.posY / 100);
                        startX = coords.clientX - centerX;
                        startY = coords.clientY - centerY;
                    } else if (point.dataset.action === 'scale') {
                        isScaling = true;
                        startScale = sticker.scale;
                        const rect = container.getBoundingClientRect();
                        const centerX = rect.left + rect.width * (sticker.posX / 100);
                        const centerY = rect.top + rect.height * (sticker.posY / 100);
                        initialDistance = getDistance(coords.clientX, coords.clientY, centerX, centerY);
                    }
                };
                
                point.addEventListener('mousedown', startControl);
                point.addEventListener('touchstart', startControl, { passive: false });
            });
            
            // Canvas 容器拖曳
            const startDrag = (e) => {
                if (e.target.classList.contains('control-point')) return;
                
                if (sticker.text && sticker.text.trim() !== '') {
                    isDragging = true;
                    const coords = getEventCoords(e);
                    startX = coords.clientX;
                    startY = coords.clientY;
                    startPosX = sticker.posX;
                    startPosY = sticker.posY;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            };
            
            container.addEventListener('mousedown', startDrag);
            container.addEventListener('touchstart', startDrag, { passive: false });
            
            // 滑鼠/觸控移動處理
            const handleMove = (e) => {
                const coords = getEventCoords(e);
                
                if (isDragging) {
                    const rect = container.getBoundingClientRect();
                    const deltaX = coords.clientX - startX;
                    const deltaY = coords.clientY - startY;
                    
                    const deltaXPercent = (deltaX / rect.width) * 100;
                    const deltaYPercent = (deltaY / rect.height) * 100;
                    
                    sticker.posX = Math.max(0, Math.min(100, startPosX + deltaXPercent));
                    sticker.posY = Math.max(0, Math.min(100, startPosY + deltaYPercent));
                    
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                    e.preventDefault();
                } else if (isRotating) {
                    const rect = container.getBoundingClientRect();
                    const centerX = rect.left + rect.width * (sticker.posX / 100);
                    const centerY = rect.top + rect.height * (sticker.posY / 100);
                    
                    const currentX = coords.clientX - centerX;
                    const currentY = coords.clientY - centerY;
                    
                    const startAngle = Math.atan2(startY, startX) * (180 / Math.PI);
                    const currentAngle = Math.atan2(currentY, currentX) * (180 / Math.PI);
                    
                    sticker.rotation = Math.round(startRotation + (currentAngle - startAngle));
                    sticker.rotation = Math.max(-180, Math.min(180, sticker.rotation));
                    
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                    e.preventDefault();
                } else if (isScaling) {
                    const rect = container.getBoundingClientRect();
                    const centerX = rect.left + rect.width * (sticker.posX / 100);
                    const centerY = rect.top + rect.height * (sticker.posY / 100);
                    
                    const currentDistance = getDistance(coords.clientX, coords.clientY, centerX, centerY);
                    const distanceRatio = currentDistance / initialDistance;
                    
                    // 改進的縮放計算：使用距離比例
                    sticker.scale = Math.max(5, Math.min(50, startScale * distanceRatio));
                    
                    redrawSticker(sticker.id);
                    updateTextBox(sticker);
                    e.preventDefault();
                }
            };
            
            const handleEnd = () => {
                if (isDragging || isRotating || isScaling) {
                    isDragging = false;
                    isRotating = false;
                    isScaling = false;
                    container.style.cursor = (sticker.text && sticker.text.trim()) ? 'move' : 'crosshair';
                }
            };
            
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleEnd);
        }
        
        function updateTextBox(sticker) {
            if (sticker.updateTextBox) {
                sticker.updateTextBox(sticker);
            }
        }

        function downloadSingleSticker(sticker) {
            if (!sticker.canvas) return;
            redrawSticker(sticker.id);
            
            let safeName = sticker.text.trim().substring(0, 8).replace(/\n/g, '_') || 'image';
            safeName = safeName.replace(/[\\/:*?"<>|]/g, '_'); 
            const fileName = `${sticker.file.name.split('.')[0]}_${safeName}.png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = sticker.canvas.toDataURL('image/png');
            link.click();
            
            showMessage('⬇️ 這張圖片已經下載囉！');
        }

        function redrawSticker(id) {
            const sticker = loadedStickers.find(s => s.id === id);
            if (!sticker || !sticker.canvas) return;

            const canvas = sticker.canvas;
            const ctx = canvas.getContext('2d');
            
            canvas.width = sticker.img.naturalWidth;
            canvas.height = sticker.img.naturalHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(sticker.img, 0, 0);

            if (sticker.text && sticker.text.trim() !== '') {
                const fontSize = canvas.height * (sticker.scale / 100);
                
                ctx.font = `bold ${fontSize}px ${currentFontFamily}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle'; 
                
                const x = canvas.width * (sticker.posX / 100);
                const y = canvas.height * (sticker.posY / 100);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(sticker.rotation * Math.PI / 180);

                const whiteStrokeWidth = fontSize * 0.06;
                const blackStrokeWidth = whiteStrokeWidth + (fontSize * 0.05);

                ctx.lineJoin = 'round';
                ctx.miterLimit = 2;

                const lines = sticker.text.split('\n');
                const lineHeight = fontSize * 1.2;
                const totalHeight = lineHeight * lines.length;
                const startY = -(totalHeight / 2) + (lineHeight / 2);
                
                lines.forEach((line, index) => {
                    const lineY = startY + index * lineHeight;
                    
                    ctx.strokeStyle = '#b8b7b5';
                    ctx.lineWidth = blackStrokeWidth;
                    ctx.strokeText(line, 0, lineY);

                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = whiteStrokeWidth;
                    ctx.strokeText(line, 0, lineY);

                    ctx.fillStyle = sticker.textColor;
                    ctx.fillText(line, 0, lineY);
                });
                
                ctx.restore();
            }
        }

        async function batchDownload() {
            if (loadedStickers.length === 0) {
                showMessage('⚠️ 沒有圖片可以下載喔！');
                return;
            }
            showMessage('⏳ 正在打包中,請稍等一下...');
            const zip = new JSZip();
            const folder = zip.folder("長輩圖_加工版");

            for (const s of loadedStickers) {
                redrawSticker(s.id);
                const data = s.canvas.toDataURL('image/png').split(',')[1];
                let safeName = s.text.trim().substring(0, 8).replace(/\n/g, '_') || 'image';
                safeName = safeName.replace(/[\\/:*?"<>|]/g, '_'); 
                folder.file(`${s.file.name.split('.')[0]}_${safeName}.png`, data, {base64: true});
            }

            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = '您的貼圖包.zip';
            a.click();
            showMessage('🎉 下載完成！請看您的下載資料夾。');
        }
    </script>
</body>
